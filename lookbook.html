<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lookbook — ATELIER NOIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="lookbook">
  <main>
    <div class="page-hero-text">
      <h1>LOOKBOOK</h1>
      <p>SPRING / SUMMER 2026</p>
    </div>
    <div class="container-wide">
      <div class="lookbook-grid">
        <figure class="look-large">
          <img src="images/look-morning.png" alt="Morning light editorial" />
          <figcaption class="caption">THE MORNING LIGHT</figcaption>
        </figure>
        <figure class="look-mid">
          <img src="images/look-tailoring.png" alt="The city" />
          <figcaption class="caption">THE CITY</figcaption>
        </figure>
        <figure class="look-mid">
          <img src="images/look-coat.png" alt="The silhouette" />
          <figcaption class="caption">THE SILHOUETTE</figcaption>
        </figure>
      </div>
      <figure class="look-wide">
        <img src="images/hero-campaign.png" alt="The everyday" />
        <figcaption class="caption">THE EVERYDAY</figcaption>
      </figure>
      <div class="look-row">
        <figure>
          <img src="images/look-dress.png" alt="Evening look" />
          <figcaption class="caption">THE EVENING</figcaption>
        </figure>
        <figure>
          <img src="images/look-evening.png" alt="Evening second frame" />
        </figure>
        <figure>
          <img src="images/about-finale.png" alt="Evening third frame" />
        </figure>
      </div>
      <div class="center-link">
        <a class="btn btn-text" href="shop.html">SHOP THE LOOK →</a>
      </div>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
